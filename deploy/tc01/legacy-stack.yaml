apiVersion: v1
kind: Namespace
metadata:
  name: tc01
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: tc01
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "ChangeMe-Root-Password"
  MYSQL_DATABASE: "legacydb"
  MYSQL_USER: "legacyuser"
  MYSQL_PASSWORD: "ChangeMe-App-Password"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: tc01
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS legacydb CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    USE legacydb;
    CREATE TABLE IF NOT EXISTS customer (
      customer_id BIGINT NOT NULL AUTO_INCREMENT,
      customer_name VARCHAR(100) NOT NULL,
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (customer_id)
    );
    INSERT INTO customer (customer_name) VALUES ('AKS Migration Test User');
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: tc01
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: tc01
spec:
  serviceName: mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        tier: db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secret
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: mysql-init
          configMap:
            name: mysql-init
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tomcat-service
  namespace: tc01
spec:
  type: ClusterIP
  selector:
    app: tomcat
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat
  namespace: tc01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tomcat
  template:
    metadata:
      labels:
        app: tomcat
        tier: was
    spec:
      containers:
        - name: tomcat
          image: ACR_LOGIN_SERVER/tc01/tomcat:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql-service.tc01.svc.cluster.local
            - name: DB_PORT
              value: "3306"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: apache-service
  namespace: tc01
spec:
  type: LoadBalancer
  selector:
    app: apache
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: tc01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
        tier: web
    spec:
      containers:
        - name: apache
          image: ACR_LOGIN_SERVER/tc01/apache:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tc01
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apache-to-tomcat
  namespace: tc01
spec:
  podSelector:
    matchLabels:
      app: tomcat
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: apache
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tomcat-to-mysql
  namespace: tc01
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tomcat
      ports:
        - protocol: TCP
          port: 3306
